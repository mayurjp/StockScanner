name: Daily EOD NSE Derivatives Scanner & GitHub Pages Deployer

on:
  schedule:
    # Trigger 1: 18:15 IST (12:45 UTC) Monday to Friday (After market close)
    - cron: '45 12 * * 1-5'
    # Trigger 2: 19:15 IST (13:45 UTC) Monday to Friday (Backup run)
    - cron: '45 13 * * 1-5'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions UI

# Permissions required for Git Commit and GitHub Pages Deployment
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-eod'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch & Analyze NSE EOD Bhavcopy
        # Run only on schedule or manual trigger (or if data/latest.json is missing)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !hashFiles('data/latest.json')
        run: |
          python analyzer.py --fetch

      - name: Commit and Push Updated Data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add data/latest.json data/downloads/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update EOD stock signals for $(date +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push origin main
            echo "Successfully committed and pushed fresh EOD data."
          else
            echo "No data changes detected."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
